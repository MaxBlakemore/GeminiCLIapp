name: "Wiz CLI Dir Scan"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wiz-dir-scan:
    name: "Wiz CLI Directory Scan"
    runs-on: ubuntu-latest
    env:
      SCAN_PATH: "."              # Set the relative path to scan
      POLICY: "MaxBlakemorePQCscan" # Set your desired Wiz CLI policy
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Download Wiz CLI
        run: |
          curl -o wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      - name: Authenticate Wiz CLI
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"

      - name: Run Wiz CLI dir scan
        run: ./wizcli scan dir "$SCAN_PATH" --policies "$POLICY"
