name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Install dependencies on VM
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release rsync
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \
              $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          EOF

      - name: Deploy application
        run: |
          # Copy project files to VM
          /usr/bin/rsync -avz --exclude '.git' --exclude 'node_modules' --exclude 'gh_actions_key*' -e "ssh -i ~/.ssh/id_ed25519" . ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }}:~/my-new-app

          # Create .env file from secrets
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }} "echo 'POSTGRES_USER=${{ secrets.POSTGRES_USER }}' > ~/my-new-app/.env"
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }} "echo 'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' >> ~/my-new-app/.env"
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }} "echo 'POSTGRES_DB=${{ secrets.POSTGRES_DB }}' >> ~/my-new-app/.env"

          # Run docker-compose on VM
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.GCP_USER }}@${{ secrets.GCP_VM_IP }} "cd ~/my-new-app && sudo docker compose up -d --build"
