name: Deploy Wiz Sensor to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  install-wiz-sensor:
    name: Install Wiz Sensor on GCP VM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up GCloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Install Wiz Sensor on GCP VM
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
          VM_NAME: ${{ secrets.GCP_VM_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
        run: |
          gcloud compute ssh ${{ secrets.GCP_USER }}@$VM_NAME --zone=$ZONE --command="
            export WIZ_API_CLIENT_ID='$WIZ_CLIENT_ID'
            export WIZ_API_CLIENT_SECRET='$WIZ_CLIENT_SECRET'
            curl -sL https://downloads.wiz.io/sensor/install.sh | sudo -E bash
          "
